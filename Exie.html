<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Pondok Pesantren</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* ===== BACKGROUND MEWAH ===== */
body {
  min-height: 100vh;
  background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
  background-size: 400% 400%;
  animation: bgMove 12s ease infinite;
  display: flex;
  align-items: center;
  justify-content: center;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* ===== CARD FORM ===== */
.container {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 35px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 0 40px rgba(255,215,0,0.4);
  animation: floatCard 4s ease-in-out infinite;
}

@keyframes floatCard {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-12px);}
}

h1 {
  text-align: center;
  color: gold;
  margin-bottom: 25px;
  text-shadow: 0 0 15px gold;
}

/* ===== INPUT ===== */
.input-group {
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 14px;
  background: rgba(255,255,255,0.9);
  transition: 0.3s;
}

input:focus, select:focus {
  transform: scale(1.03);
  box-shadow: 0 0 12px gold;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(45deg, gold, orange);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: #000;
  box-shadow: 0 0 15px gold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px gold;
}

/* ===== NOTIFIKASI ===== */
#notif {
  margin-top: 15px;
  text-align: center;
  color: #00ffcc;
  font-weight: bold;
  animation: fadeIn 1s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<div class="container">
  <h1>✨ Pendaftaran Santri ✨</h1>

  <div class="input-group">
    <input type="text" id="nama" placeholder="Nama Lengkap">
  </div>

  <div class="input-group">
    <input type="number" id="umur" placeholder="Umur">
  </div>

  <div class="input-group">
    <select id="jk">
      <option value="">Jenis Kelamin</option>
      <option>Laki-laki</option>
      <option>Perempuan</option>
    </select>
  </div>

  <div class="input-group">
    <input type="text" id="alamat" placeholder="Alamat">
  </div>

  <button onclick="daftar()">DAFTAR SEKARANG</button>

  <div id="notif"></div>
</div>

<script>
function daftar() {
  let nama = document.getElementById("nama").value;
  let umur = document.getElementById("umur").value;
  let jk = document.getElementById("jk").value;
  let alamat = document.getElementById("alamat").value;
  let notif = document.getElementById("notif");

  if (nama === "" || umur === "" || jk === "" || alamat === "") {
    notif.style.color = "red";
    notif.innerHTML = "⚠️ Harap lengkapi semua data!";
  } else {
    notif.style.color = "#00ffcc";
    notif.innerHTML = `✅ ${nama} berhasil terdaftar sebagai calon santri`;
  }
}
</script>

</body>
</html>
